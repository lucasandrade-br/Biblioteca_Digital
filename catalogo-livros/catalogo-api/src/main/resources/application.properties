spring.application.name=catalogo-api
spring.profiles.default=dev
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.datasource.url=${CATALOGO_DB_URL:jdbc:h2:file:./data/catalogo}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${CATALOGO_DB_USERNAME:sa}
spring.datasource.password=${CATALOGO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.flyway.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
token.secret=${TOKEN_SECRET}
catalogo.payment.mock.default-result=${CATALOGO_PAYMENT_MOCK_RESULT:APPROVED}
catalogo.admin.email=${ADMIN_EMAIL:}
catalogo.admin.password=${ADMIN_PASSWORD:}

server.port=${PORT:8081}
